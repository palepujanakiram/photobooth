plugins {
    id "com.android.application"
    // AGP 9 built-in Kotlin for this module (replaces org.jetbrains.kotlin.android).
    // Global android.builtInKotlin stays false for still-legacy transitive plugins.
    id "com.android.built-in-kotlin"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// App name used for APK output (e.g. photobooth-release.apk instead of app-release.apk)
def appName = "photobooth"

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore/key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace "com.srisarani.fotozenai"
    compileSdk 36
    // NDK r28+ links 16 KB-aligned ELF by default (Google Play 16 KB page-size requirement).
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Enable core library desugaring for flutter_local_notifications
        coreLibraryDesugaringEnabled true
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.srisarani.fotozenai"
        minSdkVersion rootProject.hasProperty('flutter.minSdkVersion')
            ? rootProject.property('flutter.minSdkVersion').toInteger()
            : flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            // Workaround: R8 can crash (NPE) while shrinking some Kotlin coroutines jars
            // on certain toolchain combinations. Disable minification until upstream fixes.
            minifyEnabled false
            shrinkResources false
        }
    }

    // Extract JNI libs at install time (AGP forbids android:extractNativeLibs in the
    // manifest). Required so Canon sidecar binaries in jniLibs/{arm64-v8a,armeabi-v7a}
    // can be exec'd from nativeLibraryDir (SELinux apk_data_file). ELF 16 KB LOAD alignment is still
    // required (NDK r28 / verify_16kb_alignment.sh); Play's APK zip-align check applies
    // only when libs stay uncompressed inside the APK (useLegacyPackaging=false).
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "${appName}-${variant.buildType.name}.apk"
        }
    }
}

// AGP 9 removed archivesBaseName from defaultConfig; set via the base plugin instead.
base {
    archivesName = appName
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

// Copy renamed APK to flutter-apk so it's available as {appname}-release.apk where Flutter reports output
tasks.whenTaskAdded { task ->
    if (task.name == "assembleRelease") {
        task.doLast {
            def apkDir = file("${project.buildDir}/outputs/apk/release")
            def flutterApkDir = file("${project.buildDir}/outputs/flutter-apk")
            def srcApk = file("${apkDir}/${appName}-release.apk")
            if (srcApk.exists()) {
                flutterApkDir.mkdirs()
                copy {
                    from srcApk
                    into flutterApkDir
                }
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // Firebase Messaging + BoM are provided by FlutterFire (firebase_messaging / firebase_core)
    // at versions compatible with this project’s Gradle; do not pin an older BoM or
    // firebase-messaging-ktx here — newer BoMs may omit the separate ktx artifact line.
    implementation 'com.bugsnag:bugsnag-android:6.+'
    // Canon Selphy CP1500 official USB + Wi‑Fi SDKs (local AARs).
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
    // Core library desugaring for Java 8+ APIs on older Android versions
    // Required by flutter_local_notifications (version 2.1.4+)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

